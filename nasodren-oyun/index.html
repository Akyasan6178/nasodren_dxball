<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Tells the browser to paint its own UI dark before any CSS is parsed. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05050b" />
    <title>Sinüs Aç</title>

    <!--
      CRITICAL CSS — inline, in <head>, parsed before the body renders.

      style.css is imported by main.js, so in dev it is injected by JavaScript
      and in production it is a <link> the browser must still fetch. Either way
      there is a window where the DOM exists and the stylesheet does not. That
      window is the flash: white background and an unstyled "Classic Turbo"
      button. It used to include a rotate-prompt SVG expanding to fill the
      viewport with default black fill; that prompt is gone with the portrait
      pivot, but the gate below is kept — it is what makes the window invisible
      for whatever the overlay holds next.

      Everything needed to make that window invisible lives here and nowhere
      else. Keep it small; it blocks the first paint.
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05050b;
        overflow: hidden;
      }

      /* Every HTML overlay starts hidden and is revealed by main.js once the
         renderer has painted its first frame — style.css's `body.is-ready
         .ui-layer` rule is what does the revealing, so this has to match it
         class-for-class rather than reaching for the shorter `#ui-layer`: an
         ID selector's specificity beats a class one outright, and would keep
         this permanently hidden no matter what `body.is-ready` said. */
      .ui-layer {
        display: none;
      }

      /* The loading text is the only thing allowed to show before then. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 13px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #6b6b8a;
        pointer-events: none;
      }

      #boot[hidden] {
        display: none;
      }
    </style>
  </head>

  <body>
    <div id="game-root"></div>

    <!-- HTML chrome layered over the canvas. Click-through by default; the
         controls inside opt back in. Input ignores pointer events that land in
         here, so tapping a control can't also drag the paddle.
         Hidden until body.is-ready. -->
    <div id="ui-layer" class="ui-layer">
      <!-- Mode switcher. CSS reveals it only while body[data-scene="menu"]. -->
      <button
        id="mode-toggle"
        class="mode"
        type="button"
        role="switch"
        aria-checked="false"
        aria-label="Game mode"
      >
        <span class="mode__track">
          <span class="mode__thumb" aria-hidden="true"></span>
          <span class="mode__option" data-mode="classic">Classic</span>
          <span class="mode__option" data-mode="turbo">Turbo</span>
        </span>
      </button>

      <!-- ResultsScene's high-score name field. Invisible and inert until that
           scene positions and activates it — see results-scene.js and the
           .name-input rules in style.css. A real, focusable DOM input is the
           only thing that raises a mobile virtual keyboard; the Pixi text next
           to it is what the player actually sees themselves type. -->
      <input
        id="name-input"
        class="name-input"
        type="text"
        inputmode="text"
        autocomplete="off"
        autocapitalize="characters"
        autocorrect="off"
        spellcheck="false"
        aria-label="Skor tablosu için isim"
      />
    </div>

    <div id="boot" role="status">Loading&hellip;</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
